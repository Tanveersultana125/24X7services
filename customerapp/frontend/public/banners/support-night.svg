<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 318" width="200" height="318" fill="none" role="img" aria-label="">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F7FB"/>
      <stop offset="1" stop-color="#ECEEF7"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2B45"/>
      <stop offset="1" stop-color="#11121F"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E63F0"/>
      <stop offset="1" stop-color="#3F35B8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE3A8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE3A8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#05051A" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="40" y="36" width="136" height="252" rx="20"/>
    </clipPath>
  </defs>

  <!-- Moon and stars, behind the phone -->
  <circle cx="44" cy="40" r="34" fill="url(#glow)"/>
  <path d="M52 22a20 20 0 1 0 12 34 16 16 0 1 1-12-34z" fill="#FFD98A"/>
  <g fill="#FFFFFF">
    <circle cx="16" cy="96" r="1.8" opacity="0.8"/>
    <circle cx="88" cy="14" r="1.5" opacity="0.7"/>
    <circle cx="20" cy="150" r="1.2" opacity="0.5"/>
    <path d="M186 22l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity="0.85"/>
  </g>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="32" y="28" width="152" height="268" rx="28" fill="url(#frame)"/>
  </g>
  <rect x="40" y="36" width="136" height="252" rx="20" fill="url(#screen)"/>

  <g clip-path="url(#screenClip)">
    <!-- Status bar -->
    <text x="54" y="54" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1B1C2E">11:04</text>
    <rect x="94" y="44" width="30" height="9" rx="4.5" fill="#11121F"/>
    <g fill="#1B1C2E">
      <rect x="146" y="49" width="2" height="4" rx="1"/>
      <rect x="149.5" y="47" width="2" height="6" rx="1"/>
      <rect x="153" y="45" width="2" height="8" rx="1"/>
      <rect x="158" y="46" width="11" height="6" rx="1.5" fill="none" stroke="#1B1C2E" stroke-width="1"/>
      <rect x="159.5" y="47.5" width="6" height="3" rx="0.5"/>
    </g>

    <!-- Chat header -->
    <rect x="40" y="62" width="136" height="36" fill="#FFFFFF"/>
    <rect x="40" y="97.5" width="136" height="0.8" fill="#E1E3EE"/>
    <circle cx="62" cy="80" r="11" fill="url(#agent)"/>
    <!-- headset avatar -->
    <circle cx="62" cy="78" r="4" fill="#FFFFFF"/>
    <path d="M55.5 88a6.5 6.5 0 0 1 13 0z" fill="#FFFFFF"/>
    <path d="M56.5 78a5.5 5.5 0 0 1 11 0" stroke="#FFD98A" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="70" cy="87" r="3" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="79" y="78" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1B1C2E">24X7 Support</text>
    <text x="79" y="89" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#16A34A">Online now</text>

    <!-- Customer message -->
    <rect x="86" y="108" width="80" height="34" rx="10" fill="#4B40D6"/>
    <text font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="7.5" fill="#FFFFFF">
      <tspan x="94" y="122">My fridge just</tspan>
      <tspan x="94" y="133">stopped cooling</tspan>
    </text>
    <text x="166" y="151" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="6" fill="#8A8CA3">11:02 PM</text>

    <!-- Agent reply -->
    <rect x="50" y="158" width="94" height="46" rx="10" fill="#FFFFFF" stroke="#E1E3EE" stroke-width="0.8"/>
    <text font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="7.5" fill="#1B1C2E">
      <tspan x="58" y="172">On it. Earliest slot</tspan>
      <tspan x="58" y="183">is 7:30 AM today.</tspan>
      <tspan x="58" y="194">Booked for you.</tspan>
    </text>
    <text x="50" y="213" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="6" fill="#8A8CA3">11:03 PM</text>

    <!-- Booking confirmation card -->
    <rect x="50" y="222" width="116" height="36" rx="10" fill="#FFFFFF" stroke="#E1E3EE" stroke-width="0.8"/>
    <circle cx="66" cy="240" r="8" fill="#DCFCE7"/>
    <path d="M62.5 240.2l2.4 2.4 4.6-4.8" stroke="#16A34A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="237" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#1B1C2E">Visit confirmed</text>
    <text x="80" y="248" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="6.5" fill="#6B6E85">Today · 7:30 AM</text>

    <!-- Composer -->
    <rect x="48" y="266" width="120" height="16" rx="8" fill="#FFFFFF" stroke="#E1E3EE" stroke-width="0.8"/>
    <circle cx="159" cy="274" r="5" fill="#4B40D6"/>
    <path d="M157 274h4m-1.6-1.8l1.8 1.8-1.8 1.8" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
